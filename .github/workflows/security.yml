name: Security - DAST (OWASP ZAP)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "VulnerableApp/**"
      - ".github/workflows/security.yml"
      - ".zap/**"

jobs:
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Sup3rSecr3t_ZAP!2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Aplicar migraciones y ejecutar VulnerableApp en segundo plano
        working-directory: VulnerableApp
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://+:5000
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=VulnerableDb;User Id=sa;Password=Sup3rSecr3t_ZAP!2026;TrustServerCertificate=True;"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet restore
          dotnet ef database update

          dotnet build -c Release
          nohup dotnet run -c Release --no-build > vulnerableapp.log 2>&1 &

          echo "Esperando a que VulnerableApp responda en :5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "VulnerableApp esta arriba."
              break
            fi
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"

      - name: Subir log de VulnerableApp (diagnostico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerableapp-log
          path: VulnerableApp/vulnerableapp.log
          if-no-files-found: ignore

      - name: Subir reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
